name: QR Withdraw CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: qr-withdrawal-poc
  EKS_CLUSTER_NAME: my-eks-cluster
  K8S_DEPLOYMENT: qr-withdraw
  K8S_CONTAINER: qr-withdraw

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================
  # CI
  # ==========================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Unit Tests
        run: |
          ./mvnw clean test

      - name: Build Application
        run: |
          ./mvnw clean package -DskipTests


  # ==========================================
  # CD
  # ==========================================
  deploy:
    name: Build Docker & Deploy EKS
    runs-on: ubuntu-latest

    needs:
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------
      # AWS Authentication
      # --------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------
      # ECR
      # --------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .


      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # --------------------------------------
      # Kubernetes
      # --------------------------------------

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION


      - name: Deploy to Kubernetes
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          kubectl set image \
            deployment/$K8S_DEPLOYMENT \
            $K8S_CONTAINER=$IMAGE


      # --------------------------------------
      # Verify deployment
      # --------------------------------------

      - name: Wait for Rollout
        run: |
          kubectl rollout status \
            deployment/$K8S_DEPLOYMENT \
            --timeout=180s


      - name: Verify Pods
        run: |
          kubectl get pods -l app=qr-withdraw

          kubectl get deployment qr-withdraw

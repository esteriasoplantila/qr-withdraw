apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app-container
        image: 164920712208.dkr.ecr.ap-southeast-2.amazonaws.com/backend:latest
        ports:
        - containerPort: 8080